name: Validate drafting standard data
on:
  push:
    paths: ["data/**", "scripts/**", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["data/**", "scripts/**", ".github/workflows/validate.yml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ezdxf==1.4.4
      - run: python scripts/validate.py
      - run: python scripts/validate_presentation.py
      - run: python scripts/verify_binary_assets.py
